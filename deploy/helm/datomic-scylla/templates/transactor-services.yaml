apiVersion: v1
kind: Service
metadata:
  name: {{ include "datomic-scylla.fullname" . }}-headless
  namespace: {{ .Values.namespace }}
  labels: {{- include "datomic-scylla.labels" . | nindent 4 }}
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - { name: transactor, port: 4334 }
    - { name: peer1, port: 4335 }
    - { name: peer2, port: 4336 }
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "datomic-scylla.fullname" . }}
  namespace: {{ .Values.namespace }}
  labels: {{- include "datomic-scylla.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - { name: transactor, port: 4334, targetPort: 4334 }
    - { name: peer1, port: 4335, targetPort: 4335 }
    - { name: peer2, port: 4336, targetPort: 4336 }
