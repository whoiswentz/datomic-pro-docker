name: datomic-scylla

# Dev topology: a single ScyllaDB node (RF=1). Not Datomic's production
# recommendation (see the Kubernetes chart for the 3-node / RF=3 cluster),
# but ideal for local development.

services:
  scylla:
    build:
      context: ./scylla
      args:
        SCYLLA_VERSION: ${SCYLLA_VERSION:-2026.2}
    container_name: scylla
    command: >
      --seeds=scylla --smp 1 --memory 1G --overprovisioned 1 --api-address 0.0.0.0
    volumes:
      - scylla-data:/var/lib/scylla
      - ./certs:/etc/scylla/certs:ro
    ports:
      - "9042:9042"
    healthcheck:
      test: ["CMD-SHELL", "nodetool info | grep -q 'Native Transport active: true' || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s

  datomic-init:
    image: scylladb/scylla:${SCYLLA_VERSION:-2026.2}
    container_name: datomic-init
    depends_on:
      scylla:
        condition: service_healthy
    env_file: .env
    entrypoint: ["/bin/bash", "/scripts/provision-storage.sh"]
    volumes:
      - ./scripts:/scripts:ro
      - ./certs:/certs:ro
    restart: "no"

  datomic:
    build:
      context: .
      args:
        DATOMIC_VERSION: ${DATOMIC_VERSION:-1.0.7705}
    container_name: datomic
    depends_on:
      datomic-init:
        condition: service_completed_successfully
    env_file: .env
    volumes:
      - ./certs:/certs:ro
      - ./backups:/backups
    ports:
      - "4334:4334"
      - "4335:4335"
      - "4336:4336"
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/${TRANSACTOR_HOST:-datomic}/4334' 2>/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    restart: unless-stopped

volumes:
  scylla-data:
